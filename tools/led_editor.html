<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LED Animation Editor</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #1e1e1e;
  color: #ccc;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  font-size: 13px;
  overflow: hidden;
  height: 100vh;
}

#app {
  display: grid;
  grid-template-rows: 44px 1fr auto;
  grid-template-columns: 1fr 310px;
  grid-template-areas:
    "transport transport"
    "canvas    props"
    "timeline  timeline";
  height: 100vh;
}

/* ── Transport bar ── */
#transport {
  grid-area: transport;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 12px;
  background: #2d2d2d;
  border-bottom: 1px solid #3c3c3c;
  flex-wrap: nowrap;
  overflow-x: auto;
}

#transport button {
  background: #3c3c3c;
  border: 1px solid #555;
  color: #ccc;
  padding: 3px 10px;
  cursor: pointer;
  border-radius: 3px;
  font-size: 15px;
  line-height: 1;
}
#transport button:hover { background: #505050; }
#transport button.active { background: #4ec9b0; color: #1e1e1e; }

.transport-group {
  display: flex;
  align-items: center;
  gap: 6px;
}

.transport-sep {
  width: 1px;
  height: 24px;
  background: #555;
}

#time-display {
  font-family: monospace;
  font-size: 14px;
  min-width: 60px;
  color: #4ec9b0;
}

#time-scrub { width: 120px; }
#speed-slider { width: 60px; }
#hue-slider { width: 80px; }

.transport-label {
  font-size: 11px;
  color: #888;
}

#hue-swatch {
  display: inline-block;
  width: 16px;
  height: 16px;
  border-radius: 3px;
  border: 1px solid #555;
  vertical-align: middle;
}

#fps-display {
  font-size: 11px;
  color: #555;
  margin-left: auto;
}

/* ── Canvas panel ── */
#canvas-panel {
  grid-area: canvas;
  display: flex;
  flex-direction: column;
  background: #0a0a0a;
  overflow: hidden;
}

#palette-bar {
  display: flex;
  gap: 3px;
  padding: 5px 8px;
  background: #151515;
  border-bottom: 1px solid #2a2a2a;
  flex-shrink: 0;
}

.swatch {
  width: 28px;
  height: 20px;
  border-radius: 2px;
  border: 1px solid #444;
  cursor: pointer;
  position: relative;
}
.swatch:hover { border-color: #888; }
.swatch .swatch-label {
  position: absolute;
  bottom: -12px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 7px;
  color: #555;
  white-space: nowrap;
  pointer-events: none;
}

#canvas-svg-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

#badge-svg {
  width: 100%;
  height: 100%;
  max-width: 800px;
  cursor: crosshair;
}

/* ── Property panel ── */
#props {
  grid-area: props;
  background: #252526;
  border-left: 1px solid #3c3c3c;
  overflow-y: auto;
  padding: 10px;
}

#props-empty {
  color: #666;
  text-align: center;
  margin-top: 40px;
  font-size: 12px;
}

.prop-section {
  margin-bottom: 10px;
}

.prop-section-header {
  font-size: 11px;
  font-weight: 600;
  color: #4ec9b0;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
  padding-bottom: 3px;
  border-bottom: 1px solid #3c3c3c;
}

.prop-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 4px;
}

.prop-label {
  min-width: 65px;
  font-size: 11px;
  color: #888;
  text-align: right;
}

.prop-row input[type="number"] {
  background: #3c3c3c;
  border: 1px solid #555;
  color: #ccc;
  padding: 2px 4px;
  border-radius: 2px;
  width: 70px;
  font-size: 12px;
  font-family: monospace;
}

.prop-row input[type="color"] {
  width: 32px;
  height: 22px;
  border: 1px solid #555;
  border-radius: 2px;
  cursor: pointer;
  padding: 0;
  background: transparent;
}

.prop-row select {
  background: #3c3c3c;
  border: 1px solid #555;
  color: #ccc;
  padding: 2px 4px;
  border-radius: 2px;
  font-size: 12px;
}

.prop-row button {
  background: #3c3c3c;
  border: 1px solid #555;
  color: #ccc;
  padding: 1px 8px;
  border-radius: 2px;
  cursor: pointer;
  font-size: 11px;
}
.prop-row button:hover { background: #505050; }

.spline-point-row {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-bottom: 2px;
  margin-left: 71px;
}

.palette-color-row {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-bottom: 2px;
  margin-left: 71px;
}

/* ── Timeline panel ── */
#timeline {
  grid-area: timeline;
  background: #252526;
  border-top: 1px solid #3c3c3c;
  display: flex;
  flex-direction: column;
  max-height: 240px;
}

#timeline-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 10px;
  background: #2d2d2d;
  border-bottom: 1px solid #3c3c3c;
  flex-wrap: wrap;
}

#timeline-header input[type="text"] {
  background: #3c3c3c;
  border: 1px solid #555;
  color: #ccc;
  padding: 2px 6px;
  border-radius: 2px;
  font-size: 12px;
  width: 110px;
}

#timeline-header input[type="number"] {
  background: #3c3c3c;
  border: 1px solid #555;
  color: #ccc;
  padding: 2px 6px;
  border-radius: 2px;
  font-size: 12px;
  width: 50px;
  font-family: monospace;
}

#timeline-header select {
  background: #3c3c3c;
  border: 1px solid #555;
  color: #ccc;
  padding: 2px 4px;
  border-radius: 2px;
  font-size: 12px;
}

#timeline-header button {
  background: #3c3c3c;
  border: 1px solid #555;
  color: #ccc;
  padding: 2px 10px;
  cursor: pointer;
  border-radius: 2px;
  font-size: 12px;
}
#timeline-header button:hover { background: #505050; }
#btn-export { color: #4ec9b0; }
#btn-send { color: #e8a838; }

.tl-sep {
  width: 1px;
  height: 20px;
  background: #444;
}

#track-list {
  flex: 1;
  overflow-y: auto;
}

.track-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 10px;
  border-bottom: 1px solid #2a2a2a;
  cursor: pointer;
  user-select: none;
}
.track-row:hover { background: #2a2d2e; }
.track-row.selected { background: #094771; border-left: 3px solid #4ec9b0; padding-left: 7px; }

.track-idx {
  width: 18px;
  font-weight: bold;
  color: #4ec9b0;
  font-size: 12px;
}

.track-info {
  flex: 1;
  font-size: 11px;
  color: #999;
}
.track-info .motion-type { color: #ccc; }

.track-color-preview {
  width: 16px;
  height: 16px;
  border-radius: 2px;
  border: 1px solid #555;
  flex-shrink: 0;
}

.track-timing {
  font-size: 10px;
  color: #666;
  font-family: monospace;
}

.track-delete {
  background: none;
  border: none;
  color: #666;
  cursor: pointer;
  font-size: 16px;
  padding: 0 2px;
  line-height: 1;
}
.track-delete:hover { color: #f44336; }

/* ── JSON modal ── */
#json-modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 100;
  align-items: center;
  justify-content: center;
}
#json-modal.open { display: flex; }

#json-modal-content {
  background: #2d2d2d;
  border: 1px solid #555;
  border-radius: 6px;
  padding: 16px;
  width: 600px;
  max-width: 90vw;
  max-height: 80vh;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

#json-modal-content h3 { color: #4ec9b0; font-size: 14px; }

#json-textarea {
  background: #1e1e1e;
  border: 1px solid #555;
  color: #ccc;
  font-family: monospace;
  font-size: 12px;
  padding: 8px;
  border-radius: 3px;
  resize: vertical;
  min-height: 200px;
  flex: 1;
}

#json-modal-buttons {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}

#json-modal-buttons button {
  background: #3c3c3c;
  border: 1px solid #555;
  color: #ccc;
  padding: 4px 16px;
  border-radius: 3px;
  cursor: pointer;
  font-size: 13px;
}
#json-modal-buttons button:hover { background: #505050; }
#json-modal-buttons button.primary { background: #4ec9b0; color: #1e1e1e; }
</style>
</head>
<body>

<div id="app">

<!-- ── Transport bar ── -->
<div id="transport">
  <div class="transport-group">
    <button id="btn-play" title="Play (Space)">&#9654;</button>
    <button id="btn-pause" title="Pause (Space)">&#10074;&#10074;</button>
    <button id="btn-stop" title="Stop (Escape)">&#9632;</button>
    <label style="font-size:12px;cursor:pointer;">
      <input type="checkbox" id="chk-loop" checked> Loop
    </label>
  </div>

  <div class="transport-sep"></div>

  <div class="transport-group">
    <span id="time-display">0.00s</span>
    <input type="range" id="time-scrub" min="0" max="30" step="0.02" value="0">
  </div>

  <div class="transport-sep"></div>

  <div class="transport-group">
    <span class="transport-label">Speed</span>
    <input type="range" id="speed-slider" min="0.25" max="4" step="0.25" value="1">
    <span id="speed-val" class="transport-label">1x</span>
  </div>

  <div class="transport-sep"></div>

  <div class="transport-group">
    <span class="transport-label">Hue</span>
    <input type="range" id="hue-slider" min="0" max="360" step="1" value="180">
    <span id="hue-swatch"></span>
  </div>

  <span id="fps-display">-- fps</span>

function dist(ax, ay, bx, by) {
  const dx = ax - bx, dy = ay - by;
  return Math.sqrt(dx * dx + dy * dy);
}

function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }

function hsvToRgb(h, s, v) {
  h = h - Math.floor(h);
  const c = v * s;
  const x = c * (1 - Math.abs((h * 6) % 2 - 1));
  const m = v - c;
  let r, g, b;
  const region = Math.floor(h * 6) % 6;
  switch (region) {
    case 0: r=c; g=x; b=0; break;
    case 1: r=x; g=c; b=0; break;
    case 2: r=0; g=c; b=x; break;
    case 3: r=0; g=x; b=c; break;
    case 4: r=x; g=0; b=c; break;
    default: r=c; g=0; b=x; break;
  }
  return [r+m, g+m, b+m];
}

  let m = 0.2119034982*r + 0.6806995451*g + 0.1073969566*b;
  let s = 0.0883024619*r + 0.2024326100*g + 0.7092749381*b;
  l = Math.cbrt(l); m = Math.cbrt(m); s = Math.cbrt(s);
  return [
    0.2104542553*l + 0.7936177850*m - 0.0040720468*s,
    1.9779984951*l - 2.4285922050*m + 0.4505937099*s,
    0.0259040371*l + 0.7827717662*m - 0.8086757660*s,
  ];
}

function oklabToRgb(L, a, b) {
  let l_ = L + 0.3963377774*a + 0.2158037573*b;
  let m_ = L - 0.1055613458*a - 0.0638541728*b;
  let s_ = L - 0.0894841775*a - 1.2914855480*b;
  let l = l_*l_*l_, m = m_*m_*m_, s = s_*s_*s_;
  return [
    +4.0767416621*l - 3.3077115913*m + 0.2309699292*s,
    -1.2684380046*l + 2.6097574011*m - 0.3413193965*s,
    -0.0041960863*l - 0.7034186147*m + 1.7076147010*s,
  ];
}

function catmullRom(p0, p1, p2, p3, t) {
  const t2 = t*t, t3 = t2*t;
  return [
    0.5*(2*p1[0] + (-p0[0]+p2[0])*t + (2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2 + (-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),
    0.5*(2*p1[1] + (-p0[1]+p2[1])*t + (2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2 + (-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3),
  ];
}

function normToSvg(nx, ny) {
  return [SVG_X_MIN + nx * SVG_X_RANGE, SVG_Y_MIN + ny * SVG_Y_RANGE];
}

function svgToNorm(sx, sy) {
  return [(sx - SVG_X_MIN) / SVG_X_RANGE, (sy - SVG_Y_MIN) / SVG_Y_RANGE];
}

// Linear light [0,1] → sRGB byte [0,255] for accurate monitor display.
// The field evaluator applies badge gamma + WB so its output represents the
// light the WS2812 LEDs actually emit. sRGB encoding maps that linear light
// to monitor values, giving a WYSIWYG preview.
function linearToSRGB8(v) {
  v = clamp01(v);
  const s = v <= 0.0031308 ? v * 12.92 : 1.055 * Math.pow(v, 1/2.4) - 0.055;
  return Math.round(s * 255);
}

function rgbfToCss(r, g, b) {
  return `rgb(${linearToSRGB8(r)},${linearToSRGB8(g)},${linearToSRGB8(b)})`;
}

function rgbfToLinearCss(r, g, b) {
  return `rgb(${Math.round(clamp01(r)*255)},${Math.round(clamp01(g)*255)},${Math.round(clamp01(b)*255)})`;
}

// =========================================================================
// PALETTE RESOLUTION
// =========================================================================
function resolvePalette(hueDeg) {
  const h = hueDeg / 360;
  return [
    hsvToRgb(h, 0.9, 1.0),         // user_primary
    hsvToRgb(h, 0.4, 1.0),         // user_light
    hsvToRgb(h, 0.9, 0.4),         // user_dark
    hsvToRgb(h + 0.5, 0.9, 1.0),   // user_complement
    hsvToRgb(h + 30/360, 0.9, 1.0),// user_analogous1
    hsvToRgb(h - 30/360, 0.9, 1.0),// user_analogous2
    [0.18, 0.85, 0.30],            // theme_green
    [1.0, 0.75, 0.15],             // theme_gold
    [1.0, 0.95, 0.85],             // theme_white
  ];
}

// =========================================================================
// BEHAVIOR EVALUATION
// =========================================================================
function evaluateMotion(m, t) {
  switch (m.type) {
    case 'static':
      return [m.pos[0], m.pos[1]];
    case 'orbit': {
      const dir = m.reverse ? -1 : 1;
      const angle = (m.phase || 0) + dir * TWO_PI * t / m.period;
      return [m.center[0] + m.rx * Math.cos(angle), m.center[1] + m.ry * Math.sin(angle)];
    }
    case 'pingpong': {
      const phase = (t % m.period) / m.period;
      const lerp = 1 - Math.abs(2 * phase - 1);
      return [m.a[0] + (m.b[0] - m.a[0]) * lerp, m.a[1] + (m.b[1] - m.a[1]) * lerp];
    }
    case 'noise_drift': {
      const s = m.speed || 1;
      const x = (m.amplitude || 0.2) *
        (Math.sin(t*s*1.0) + 0.5*Math.sin(t*s*1.7+0.3) + 0.3*Math.sin(t*s*2.9+1.1)) / 1.8;
      const y = (m.amplitude || 0.2) *
        (Math.sin(t*s*1.3) + 0.5*Math.sin(t*s*2.1+0.7) + 0.3*Math.sin(t*s*3.7+2.3)) / 1.8;
      return [m.center[0] + x, m.center[1] + y];
    }
    case 'lissajous': {
      const st = t * (m.speed || 1);
      const x = m.center[0] + m.rx * Math.sin(TWO_PI * m.freq_a * st + (m.phase || 0));
      const y = m.center[1] + m.ry * Math.sin(TWO_PI * m.freq_b * st);
      return [x, y];
    }
    case 'spline': {
      const pts = m.points;
      const count = pts.length;
      if (count < 2) return [pts[0][0], pts[0][1]];
      let phase = (t % m.period) / m.period;
      if (m.reverse) phase = 1 - phase;
      let idx = phase * count;
      let seg = Math.floor(idx);
      if (seg >= count) seg = count - 1;
      const frac = idx - seg;
      const i0 = (seg - 1 + count) % count;
      const i1 = seg % count;
      const i2 = (seg + 1) % count;
      const i3 = (seg + 2) % count;
      return catmullRom(pts[i0], pts[i1], pts[i2], pts[i3], frac);
    }
  }
  return [0.5, 0.5];
}

function evaluateColor(c, t, palette) {
  switch (c.type) {
    case 'static':
      return [c.color[0], c.color[1], c.color[2]];
    case 'hue_cycle': {
      let phase = (t % c.period) / c.period;
      if (c.ping_pong) phase = 1.0 - Math.abs(2.0 * phase - 1.0);
      const hue = c.from_hue + (c.to_hue - c.from_hue) * phase;
      return hsvToRgb(hue, 0.9, 1.0);
    }
    case 'palette': {
      const colors = c.colors;
      const count = colors.length;
      if (count < 2) return [colors[0][0], colors[0][1], colors[0][2]];
      const phase = (t % c.period) / c.period;
      const idx = phase * (count - 1);
      const lo = Math.floor(idx);
      let hi = lo + 1;
      if (hi >= count) hi = 0;
      const frac = idx - lo;
      const a = colors[lo], b = colors[hi];
      return [a[0]+(b[0]-a[0])*frac, a[1]+(b[1]-a[1])*frac, a[2]+(b[2]-a[2])*frac];
    }
    case 'palette_slot': {
      const idx = PALETTE_SLOT_NAMES.indexOf(c.slot);
      if (idx >= 0 && idx < palette.length) return [...palette[idx]];
      return [1, 1, 1];
    }
  }
  return [1, 1, 1];
}

function evaluateScalar(s, t) {
  if (typeof s === 'number') return s;
  switch (s.type) {
    case 'static': return s.value;
    case 'breathe': {
      const angle = (s.phase || 0) + TWO_PI * t / s.period;
      return s.base + s.amplitude * Math.sin(angle);
    }
    case 'noise': {
      const sp = s.speed || 1;
      const v = (Math.sin(t*sp*1.0) + 0.5*Math.sin(t*sp*1.7+0.3) + 0.3*Math.sin(t*sp*2.9+1.1)) / 1.8;
      return s.base + s.amplitude * v;
    }
  }
  return 1;
}

// =========================================================================
// FIELD EVALUATION
// =========================================================================
function applySaturationFloor(r, g, b) {
  const maxC = Math.max(r, g, b);
  const minC = Math.min(r, g, b);
  if (maxC <= 0.001) return [r, g, b];
  const sat = (maxC - minC) / maxC;
  if (sat >= SAT_FLOOR) return [r, g, b];
  const target = maxC * (1 - SAT_FLOOR);
  const scale = (maxC > minC) ? (maxC - target) / (maxC - minC) : 1;
  return [maxC - (maxC - r) * scale, maxC - (maxC - g) * scale, maxC - (maxC - b) * scale];
}

function evaluateField(lights) {
  const out = [];
  for (let i = 0; i < NUM_LEDS; i++) {
    let pr = 0, pg = 0, pb = 0;
    for (let j = 0; j < lights.length; j++) {
      const lt = lights[j];
      if (lt.intensity <= 0) continue;
      const d = dist(LED_POS[i][0], LED_POS[i][1], lt.pos[0], lt.pos[1]);
      const rNorm = d / lt.radius;
      const tt = 1 - rNorm * rNorm;
      const atten = tt > 0 ? lt.intensity * tt * tt : 0;
      if (atten <= 0) continue;
      pr += lt.color[0] * atten;
      pg += lt.color[1] * atten;
      pb += lt.color[2] * atten;
    }
    // Scale proportionally instead of per-channel clamping to preserve
    // color ratios. Per-channel clamping shifts hue toward white when
    // additive contributions push individual channels past 1.0.
    const maxC = Math.max(pr, pg, pb);
    let r, g, b;
    if (maxC > 1.0) {
      const s = 1.0 / maxC;
      r = pr * s; g = pg * s; b = pb * s;
    } else {
      r = pr; g = pg; b = pb;
    }
    if (r < 0) r = 0;
    if (g < 0) g = 0;
    if (b < 0) b = 0;
    [r, g, b] = applySaturationFloor(r, g, b);
    // Simulate badge output: apply gamma + white balance so the editor
    // previews what the WS2812 LEDs actually emit.
    r = Math.pow(r, GAMMA) * WB_R;
    g = Math.pow(g, GAMMA) * WB_G;
    b = Math.pow(b, GAMMA) * WB_B;
    out.push([r, g, b]);
  }
  return out;
}

// =========================================================================
// DEFAULT VALUES
// =========================================================================
function defaultMotion(type) {
  switch (type) {
    case 'static': return {type: 'static', pos: [0.5, 0.5]};
    case 'orbit': return {type: 'orbit', center: [0.5, 0.5], rx: 0.3, ry: 0.3, period: 4, phase: 0, reverse: false};
    case 'pingpong': return {type: 'pingpong', a: [0.1, 0.5], b: [0.9, 0.5], period: 4};
    case 'noise_drift': return {type: 'noise_drift', center: [0.5, 0.5], amplitude: 0.2, speed: 1};
    case 'lissajous': return {type: 'lissajous', center: [0.5, 0.5], rx: 0.3, ry: 0.3, freq_a: 1, freq_b: 2, phase: 0, speed: 1};
    case 'spline': return {type: 'spline', points: [[0.2, 0.5], [0.5, 0.2], [0.8, 0.5], [0.5, 0.8]], period: 4, reverse: false};
  }
  return {type: 'static', pos: [0.5, 0.5]};
}

function defaultColor(type) {
  switch (type) {
    case 'static': return {type: 'static', color: [1, 1, 1]};
    case 'hue_cycle': return {type: 'hue_cycle', from_hue: 0, to_hue: 1, period: 4, ping_pong: false};
    case 'palette': return {type: 'palette', colors: [[1,0,0],[0,1,0]], count: 2, period: 4};
    case 'palette_slot': return {type: 'palette_slot', slot: 'user_primary'};
  }
  return {type: 'palette_slot', slot: 'user_primary'};
}

function defaultScalar(type) {
  switch (type) {
    case 'static': return {type: 'static', value: 1};
    case 'breathe': return {type: 'breathe', base: 0.5, amplitude: 0.2, period: 3, phase: 0};
    case 'noise': return {type: 'noise', base: 0.8, amplitude: 0.2, speed: 1};
  }
  return {type: 'static', value: 1};
}

function normalizeScalar(s) {
  if (s == null) return {type: 'static', value: 1};
  if (typeof s === 'number') return {type: 'static', value: s};
  return s;
}

function newTrack(pos) {
  return {
    motion: {type: 'static', pos: pos || [0.5, 0.5]},
    color: {type: 'palette_slot', slot: 'user_primary'},
    radius: {type: 'static', value: 0.3},
    intensity: {type: 'static', value: 1.0},
    startTime: 0,
    fadeIn: 0,
  };
}

// =========================================================================
// EDITOR STATE
// =========================================================================
const editor = {
  animation: {
    name: 'untitled',
    duration: 0,
    tracks: [newTrack()],
  },
  selectedTrack: 0,
  playing: false,
  time: 0,
  speed: 1,
  looping: true,
  userHue: 180,
  palette: resolvePalette(180),
  lights: [],
  ledColors: [],
  frameCount: 0,
  lastFpsTime: 0,
  dirty: true,
};

// =========================================================================
// EVALUATE FRAME
// =========================================================================
function evaluateFrame(t) {
  const tracks = editor.animation.tracks;
  const lights = [];
  for (let i = 0; i < tracks.length; i++) {
    const track = tracks[i];
    const startTime = track.startTime || 0;
    if (t < startTime) {
      lights.push({pos: [0,0], color: [0,0,0], radius: 0, intensity: 0});
      continue;
    }
    const tt = t - startTime;
    const pos = evaluateMotion(track.motion, tt);
    const color = evaluateColor(track.color, tt, editor.palette);
    const radius = evaluateScalar(normalizeScalar(track.radius), tt);
    // Clamp before Math.pow: a breathe with amplitude > base evaluates negative
    // for part of its cycle, and Math.pow() of a negative base with a fractional
    // exponent returns NaN.
    let rawIntensity = evaluateScalar(normalizeScalar(track.intensity), tt);
    if (rawIntensity < 0) rawIntensity = 0;
    let intensity = Math.pow(rawIntensity, INTENSITY_CURVE / GAMMA);
    const fadeIn = track.fadeIn || 0;
    if (fadeIn > 0 && tt < fadeIn) {
      const fade = tt / fadeIn;
      intensity *= Math.pow(fade, 1.0 / GAMMA);
    }
    lights.push({pos, color, radius, intensity});
  }
  editor.lights = lights;
  editor.ledColors = evaluateField(lights);
}

// =========================================================================
// SVG RENDERING
// =========================================================================
const svgEl = document.getElementById('badge-svg');
const SVG_NS = 'http://www.w3.org/2000/svg';
const gradients = Array.from({length: NUM_LEDS}, (_, i) => document.getElementById('g' + i));
const dotEls = Array.from({length: NUM_LEDS}, (_, i) => document.getElementById('dot' + i));
const pathsGroup = document.getElementById('paths');
const lightsGroup = document.getElementById('lights');

function renderCanvas() {
  // Update LED glows
  for (let i = 0; i < NUM_LEDS; i++) {
    const [r, g, b] = editor.ledColors[i] || [0, 0, 0];
    const color = rgbfToCss(r, g, b);
    const grad = gradients[i];
    const stops = grad.getElementsByTagName('stop');
    if (stops.length >= 2) {
      stops[0].setAttribute('stop-color', color);
      stops[0].setAttribute('stop-opacity', '0.9');
    }
    if (stops.length >= 3) {
      stops[1].setAttribute('stop-color', color);
      stops[1].setAttribute('stop-opacity', '0.2');
    }
    const lastStop = stops[stops.length - 1];
    lastStop.setAttribute('stop-color', color);
    lastStop.setAttribute('stop-opacity', '0');
    dotEls[i].setAttribute('fill', color);
  }

  // Clear and rebuild path overlays and light markers
  pathsGroup.innerHTML = '';
  lightsGroup.innerHTML = '';

  for (let i = 0; i < editor.lights.length; i++) {
    const lt = editor.lights[i];
    const track = editor.animation.tracks[i];
    const selected = i === editor.selectedTrack;
    const alpha = Math.min(1, Math.max(0.15, lt.intensity));
    const cr = Math.round(clamp01(lt.color[0]) * 255);
    const cg = Math.round(clamp01(lt.color[1]) * 255);
    const cb = Math.round(clamp01(lt.color[2]) * 255);
    const markerColor = `rgb(${cr},${cg},${cb})`;

    // Path visualization for selected track
    if (selected && track) {
      renderPathOverlay(track.motion, markerColor, i);
    }

    if (lt.intensity <= 0 && !selected) continue;

    const [sx, sy] = normToSvg(lt.pos[0], lt.pos[1]);
    const svgRad = lt.radius * Math.max(SVG_X_RANGE, SVG_Y_RANGE);

    // Radius ring
    const ring = document.createElementNS(SVG_NS, 'circle');
    ring.setAttribute('cx', sx);
    ring.setAttribute('cy', sy);
    ring.setAttribute('r', svgRad);
    ring.setAttribute('fill', 'none');
    ring.setAttribute('stroke', markerColor);
    ring.setAttribute('stroke-width', selected ? '0.5' : '0.3');
    ring.setAttribute('stroke-dasharray', selected ? '2,1' : '1,1');
    ring.setAttribute('opacity', selected ? 0.7 : alpha * 0.3);
    lightsGroup.appendChild(ring);

    // Center marker
    const dot = document.createElementNS(SVG_NS, 'circle');
    dot.setAttribute('cx', sx);
    dot.setAttribute('cy', sy);
    dot.setAttribute('r', selected ? '2.5' : '1.5');
    dot.setAttribute('fill', selected ? markerColor : 'none');
    dot.setAttribute('stroke', markerColor);
    dot.setAttribute('stroke-width', selected ? '0.6' : '0.4');
    dot.setAttribute('opacity', selected ? 1 : Math.max(0.3, alpha));
    dot.setAttribute('cursor', 'grab');
    dot.dataset.trackIdx = i;
    lightsGroup.appendChild(dot);

    // Track index label
    if (selected) {
      const txt = document.createElementNS(SVG_NS, 'text');
      txt.setAttribute('x', sx + 3);
      txt.setAttribute('y', sy - 3);
      txt.setAttribute('font-family', 'monospace');
      txt.setAttribute('font-size', '4');
      txt.setAttribute('fill', '#4ec9b0');
      txt.textContent = i;
      lightsGroup.appendChild(txt);
    }
  }
}

function renderPathOverlay(motion, color, trackIdx) {
  // Helper: create a draggable handle circle
  function handle(sx, sy, handleId) {
    const d = document.createElementNS(SVG_NS, 'circle');
    d.setAttribute('cx', sx); d.setAttribute('cy', sy);
    d.setAttribute('r', '2.5');
    d.setAttribute('fill', color);
    d.setAttribute('fill-opacity', '0.15');
    d.setAttribute('stroke', color);
    d.setAttribute('stroke-width', '0.5');
    d.setAttribute('opacity', '0.8');
    d.setAttribute('cursor', 'grab');
    d.dataset.trackIdx = trackIdx;
    d.dataset.handle = handleId;
    pathsGroup.appendChild(d);
  }

  // Helper: create a draggable handle square (for spline points)
  function handleRect(sx, sy, handleId) {
    const size = 4;
    const d = document.createElementNS(SVG_NS, 'rect');
    d.setAttribute('x', sx - size/2); d.setAttribute('y', sy - size/2);
    d.setAttribute('width', size); d.setAttribute('height', size);
    d.setAttribute('fill', color);
    d.setAttribute('fill-opacity', '0.15');
    d.setAttribute('stroke', color);
    d.setAttribute('stroke-width', '0.5');
    d.setAttribute('opacity', '0.8');
    d.setAttribute('cursor', 'grab');
    d.dataset.trackIdx = trackIdx;
    d.dataset.handle = handleId;
    pathsGroup.appendChild(d);
  }

  switch (motion.type) {
    case 'orbit': {
      const [cx, cy] = normToSvg(motion.center[0], motion.center[1]);
      const rx = motion.rx * SVG_X_RANGE;
      const ry = motion.ry * SVG_Y_RANGE;
      const el = document.createElementNS(SVG_NS, 'ellipse');
      el.setAttribute('cx', cx);
      el.setAttribute('cy', cy);
      el.setAttribute('rx', rx);
      el.setAttribute('ry', ry);
      el.setAttribute('fill', 'none');
      el.setAttribute('stroke', color);
      el.setAttribute('stroke-width', '0.3');
      el.setAttribute('stroke-dasharray', '2,2');
      el.setAttribute('opacity', '0.4');
      pathsGroup.appendChild(el);
      break;
    }
    case 'pingpong': {
      const [ax, ay] = normToSvg(motion.a[0], motion.a[1]);
      const [bx, by] = normToSvg(motion.b[0], motion.b[1]);
      const el = document.createElementNS(SVG_NS, 'line');
      el.setAttribute('x1', ax); el.setAttribute('y1', ay);
      el.setAttribute('x2', bx); el.setAttribute('y2', by);
      el.setAttribute('stroke', color);
      el.setAttribute('stroke-width', '0.3');
      el.setAttribute('stroke-dasharray', '2,2');
      el.setAttribute('opacity', '0.4');
      pathsGroup.appendChild(el);
      handle(ax, ay, 'a');
      handle(bx, by, 'b');
      break;
    }
    case 'noise_drift': {
      const [cx, cy] = normToSvg(motion.center[0], motion.center[1]);
      const amp = (motion.amplitude || 0.2) * Math.max(SVG_X_RANGE, SVG_Y_RANGE);
      const el = document.createElementNS(SVG_NS, 'circle');
      el.setAttribute('cx', cx); el.setAttribute('cy', cy);
      el.setAttribute('r', amp);
      el.setAttribute('fill', 'none');
      el.setAttribute('stroke', color);
      el.setAttribute('stroke-width', '0.2');
      el.setAttribute('stroke-dasharray', '1,2');
      el.setAttribute('opacity', '0.3');
      pathsGroup.appendChild(el);
      break;
    }
    case 'lissajous': {
      const pts = [];
      const steps = 200;
      for (let s = 0; s <= steps; s++) {
        const t = (s / steps) * (1 / (Math.min(motion.freq_a || 1, motion.freq_b || 1) * (motion.speed || 1)));
        const [nx, ny] = evaluateMotion(motion, t);
        const [sx, sy] = normToSvg(nx, ny);
        pts.push(`${sx},${sy}`);
      }
      const el = document.createElementNS(SVG_NS, 'polyline');
      el.setAttribute('points', pts.join(' '));
      el.setAttribute('fill', 'none');
      el.setAttribute('stroke', color);
      el.setAttribute('stroke-width', '0.3');
      el.setAttribute('opacity', '0.3');
      pathsGroup.appendChild(el);
      break;
    }
    case 'spline': {
      if (!motion.points || motion.points.length < 2) break;
      const pts = [];
      const steps = 200;
      for (let s = 0; s <= steps; s++) {
        const t = (s / steps) * motion.period;
        const [nx, ny] = evaluateMotion(motion, t);
        const [sx, sy] = normToSvg(nx, ny);
        pts.push(`${sx},${sy}`);
      }
      const el = document.createElementNS(SVG_NS, 'polyline');
      el.setAttribute('points', pts.join(' '));
      el.setAttribute('fill', 'none');
      el.setAttribute('stroke', color);
      el.setAttribute('stroke-width', '0.3');
      el.setAttribute('opacity', '0.4');
      pathsGroup.appendChild(el);
      for (let i = 0; i < motion.points.length; i++) {
        const [px, py] = normToSvg(motion.points[i][0], motion.points[i][1]);
        handleRect(px, py, 'spline-' + i);
      }
      break;
    }
  }
}

// =========================================================================
// PALETTE BAR
// =========================================================================
function renderPaletteBar() {
  const bar = document.getElementById('palette-bar');
  bar.innerHTML = '';
  for (let i = 0; i < PALETTE_SLOT_NAMES.length; i++) {
    const div = document.createElement('div');
    div.className = 'swatch';
    div.id = 'swatch-' + PALETTE_SLOT_NAMES[i];
    div.title = PALETTE_SLOT_NAMES[i];
    const c = editor.palette[i];
    div.style.background = rgbfToLinearCss(c[0], c[1], c[2]);
    const lbl = document.createElement('span');
    lbl.className = 'swatch-label';
    lbl.textContent = PALETTE_LABELS[i];
    div.appendChild(lbl);
    div.onclick = () => {
      if (editor.selectedTrack >= 0 && editor.selectedTrack < editor.animation.tracks.length) {
        editor.animation.tracks[editor.selectedTrack].color = {type: 'palette_slot', slot: PALETTE_SLOT_NAMES[i]};
        renderProps();
        editor.dirty = true;
      }
    };
    bar.appendChild(div);
  }
}

function updatePaletteBar() {
  for (let i = 0; i < PALETTE_SLOT_NAMES.length; i++) {
    const el = document.getElementById('swatch-' + PALETTE_SLOT_NAMES[i]);
    if (el) {
      const c = editor.palette[i];
      el.style.background = rgbfToLinearCss(c[0], c[1], c[2]);
    }
  }
}

// =========================================================================
// PROPERTY PANEL
// =========================================================================
function renderProps() {
  const content = document.getElementById('props-content');
  const empty = document.getElementById('props-empty');
  const idx = editor.selectedTrack;
  const tracks = editor.animation.tracks;

  if (idx < 0 || idx >= tracks.length) {
    content.style.display = 'none';
    empty.style.display = '';
    return;
  }

  content.style.display = '';
  empty.style.display = 'none';
  content.innerHTML = '';

  const track = tracks[idx];

  // Motion
  content.appendChild(buildSection('Motion', () => {
    const rows = [];
    rows.push(buildDropdown('type', track.motion.type,
      ['static','orbit','pingpong','noise_drift','lissajous','spline'],
      v => { track.motion = defaultMotion(v); renderProps(); }
    ));
    switch (track.motion.type) {
      case 'static':
        rows.push(buildVec2Row('pos', track.motion.pos, v => { track.motion.pos = v; }));
        break;
      case 'orbit':
        rows.push(buildVec2Row('center', track.motion.center, v => { track.motion.center = v; }));
        rows.push(buildNumRow('rx', track.motion.rx, v => { track.motion.rx = v; }));
        rows.push(buildNumRow('ry', track.motion.ry, v => { track.motion.ry = v; }));
        rows.push(buildNumRow('period', track.motion.period, v => { track.motion.period = v; }, 0.1));
        rows.push(buildNumRow('phase', track.motion.phase, v => { track.motion.phase = v; }, 0.01));
        rows.push(buildCheckboxRow('reverse', track.motion.reverse, v => { track.motion.reverse = v; }));
        break;
      case 'pingpong':
        rows.push(buildVec2Row('a', track.motion.a, v => { track.motion.a = v; }));
        rows.push(buildVec2Row('b', track.motion.b, v => { track.motion.b = v; }));
        rows.push(buildNumRow('period', track.motion.period, v => { track.motion.period = v; }, 0.1));
        break;
      case 'noise_drift':
        rows.push(buildVec2Row('center', track.motion.center, v => { track.motion.center = v; }));
        rows.push(buildNumRow('amplitude', track.motion.amplitude, v => { track.motion.amplitude = v; }));
        rows.push(buildNumRow('speed', track.motion.speed, v => { track.motion.speed = v; }, 0.1));
        break;
      case 'lissajous':
        rows.push(buildVec2Row('center', track.motion.center, v => { track.motion.center = v; }));
        rows.push(buildNumRow('rx', track.motion.rx, v => { track.motion.rx = v; }));
        rows.push(buildNumRow('ry', track.motion.ry, v => { track.motion.ry = v; }));
        rows.push(buildNumRow('freq_a', track.motion.freq_a, v => { track.motion.freq_a = v; }, 0.1));
        rows.push(buildNumRow('freq_b', track.motion.freq_b, v => { track.motion.freq_b = v; }, 0.1));
        rows.push(buildNumRow('phase', track.motion.phase, v => { track.motion.phase = v; }, 0.01));
        rows.push(buildNumRow('speed', track.motion.speed || 1, v => { track.motion.speed = v; }, 0.1));
        break;
      case 'spline':
        rows.push(buildNumRow('period', track.motion.period, v => { track.motion.period = v; }, 0.1));
        rows.push(buildCheckboxRow('reverse', track.motion.reverse, v => { track.motion.reverse = v; }));
        rows.push(buildSplinePoints(track.motion));
        break;
    }
    return rows;
  }));

  // Color
  content.appendChild(buildSection('Color', () => {
    const rows = [];
    rows.push(buildDropdown('type', track.color.type,
      ['static','hue_cycle','palette','palette_slot'],
      v => { track.color = defaultColor(v); renderProps(); }
    ));
    switch (track.color.type) {
      case 'static':
        rows.push(buildColorRow('color', track.color.color, v => { track.color.color = v; }));
        break;
      case 'hue_cycle':
        rows.push(buildNumRow('from_hue', track.color.from_hue, v => { track.color.from_hue = v; }, 0.01));
        rows.push(buildNumRow('to_hue', track.color.to_hue, v => { track.color.to_hue = v; }, 0.01));
        rows.push(buildNumRow('period', track.color.period, v => { track.color.period = v; }, 0.1));
        rows.push(buildCheckboxRow('ping_pong', track.color.ping_pong, v => { track.color.ping_pong = v; }));
        break;
      case 'palette':
        rows.push(buildNumRow('period', track.color.period, v => { track.color.period = v; }, 0.1));
        rows.push(buildPaletteColors(track.color));
        break;
      case 'palette_slot':
        rows.push(buildDropdown('slot', track.color.slot, PALETTE_SLOT_NAMES,
          v => { track.color.slot = v; }
        ));
        break;
    }
    return rows;
  }));

  // Radius
  const rad = normalizeScalar(track.radius);
  track.radius = rad;
  content.appendChild(buildSection('Radius', () => buildScalarRows(rad, v => { track.radius = v; })));

  // Intensity
  const inten = normalizeScalar(track.intensity);
  track.intensity = inten;
  content.appendChild(buildSection('Intensity', () => buildScalarRows(inten, v => { track.intensity = v; })));

  // Timing
  content.appendChild(buildSection('Timing', () => [
    buildNumRow('startTime', track.startTime || 0, v => { track.startTime = v; }, 0.1),
    buildNumRow('fadeIn', track.fadeIn || 0, v => { track.fadeIn = v; }, 0.1),
  ]));
}

function buildSection(title, buildFn) {
  const div = document.createElement('div');
  div.className = 'prop-section';
  const h = document.createElement('div');
  h.className = 'prop-section-header';
  h.textContent = title;
  div.appendChild(h);
  const rows = buildFn();
  for (const r of (Array.isArray(rows) ? rows : [rows])) {
    if (r) div.appendChild(r);
  }
  return div;
}

function buildCheckboxRow(label, value, onChange) {
  const row = document.createElement('div');
  row.className = 'prop-row';
  const lbl = document.createElement('span');
  lbl.className = 'prop-label';
  lbl.textContent = label;
  const inp = document.createElement('input');
  inp.type = 'checkbox';
  inp.checked = !!value;
  inp.onchange = () => { onChange(inp.checked); editor.dirty = true; };
  row.appendChild(lbl);
  row.appendChild(inp);
  return row;
}

function buildNumRow(label, value, onChange, step) {
  const row = document.createElement('div');
  row.className = 'prop-row';
  const lbl = document.createElement('span');
  lbl.className = 'prop-label';
  lbl.textContent = label;
  const inp = document.createElement('input');
  inp.type = 'number';
  inp.value = parseFloat((value || 0).toFixed(4));
  inp.step = step || 0.01;
  inp.oninput = () => { onChange(parseFloat(inp.value) || 0); editor.dirty = true; };
  row.appendChild(lbl);
  row.appendChild(inp);
  return row;
}

function buildVec2Row(label, vec, onChange) {
  const row = document.createElement('div');
  row.className = 'prop-row';
  const lbl = document.createElement('span');
  lbl.className = 'prop-label';
  lbl.textContent = label;
  const ix = document.createElement('input');
  ix.type = 'number'; ix.step = 0.01; ix.value = parseFloat(vec[0].toFixed(3));
  ix.style.width = '60px';
  const iy = document.createElement('input');
  iy.type = 'number'; iy.step = 0.01; iy.value = parseFloat(vec[1].toFixed(3));
  iy.style.width = '60px';
  const update = () => { onChange([parseFloat(ix.value)||0, parseFloat(iy.value)||0]); editor.dirty = true; };
  ix.oninput = update;
  iy.oninput = update;
  row.appendChild(lbl);
  row.appendChild(ix);
  row.appendChild(iy);
  return row;
}

function buildColorRow(label, rgb, onChange) {
  const row = document.createElement('div');
  row.className = 'prop-row';
  const lbl = document.createElement('span');
  lbl.className = 'prop-label';
  lbl.textContent = label;
  const inp = document.createElement('input');
  inp.type = 'color';
  inp.value = '#' + [rgb[0], rgb[1], rgb[2]].map(v => Math.round(clamp01(v)*255).toString(16).padStart(2,'0')).join('');
  inp.oninput = () => {
    const hex = inp.value;
    const r = parseInt(hex.slice(1,3),16)/255;
    const g = parseInt(hex.slice(3,5),16)/255;
    const b = parseInt(hex.slice(5,7),16)/255;
    onChange([r, g, b]);
    editor.dirty = true;
  };
  row.appendChild(lbl);
  row.appendChild(inp);
  // Also show R/G/B inputs
  for (let c = 0; c < 3; c++) {
    const ci = document.createElement('input');
    ci.type = 'number'; ci.step = 0.01; ci.min = 0; ci.max = 1;
    ci.value = parseFloat(rgb[c].toFixed(2));
    ci.style.width = '48px';
    ci.oninput = () => {
      rgb[c] = parseFloat(ci.value) || 0;
      onChange([...rgb]);
      inp.value = '#' + rgb.map(v => Math.round(clamp01(v)*255).toString(16).padStart(2,'0')).join('');
      editor.dirty = true;
    };
    row.appendChild(ci);
  }
  return row;
}

function buildDropdown(label, value, options, onChange) {
  const row = document.createElement('div');
  row.className = 'prop-row';
  const lbl = document.createElement('span');
  lbl.className = 'prop-label';
  lbl.textContent = label;
  const sel = document.createElement('select');
  for (const opt of options) {
    const o = document.createElement('option');
    o.value = opt;
    o.textContent = opt;
    if (opt === value) o.selected = true;
    sel.appendChild(o);
  }
  sel.onchange = () => { onChange(sel.value); editor.dirty = true; };
  row.appendChild(lbl);
  row.appendChild(sel);
  return row;
}

function buildScalarRows(scalar, setScalar) {
  const rows = [];
  rows.push(buildDropdown('type', scalar.type, ['static','breathe','noise'], v => {
    const ns = defaultScalar(v);
    Object.assign(scalar, ns);
    // Clear any extra keys from old type
    for (const k of Object.keys(scalar)) {
      if (!(k in ns)) delete scalar[k];
    }
    setScalar(scalar);
    renderProps();
  }));
  switch (scalar.type) {
    case 'static':
      rows.push(buildNumRow('value', scalar.value, v => { scalar.value = v; }));
      break;
    case 'breathe':
      rows.push(buildNumRow('base', scalar.base, v => { scalar.base = v; }));
      rows.push(buildNumRow('amplitude', scalar.amplitude, v => { scalar.amplitude = v; }));
      rows.push(buildNumRow('period', scalar.period, v => { scalar.period = v; }, 0.1));
      rows.push(buildNumRow('phase', scalar.phase, v => { scalar.phase = v; }, 0.01));
      break;
    case 'noise':
      rows.push(buildNumRow('base', scalar.base, v => { scalar.base = v; }));
      rows.push(buildNumRow('amplitude', scalar.amplitude, v => { scalar.amplitude = v; }));
      rows.push(buildNumRow('speed', scalar.speed, v => { scalar.speed = v; }, 0.1));
      break;
  }
  return rows;
}

function buildSplinePoints(motion) {
  const container = document.createElement('div');
  const pts = motion.points || [];

  for (let i = 0; i < pts.length; i++) {
    const row = document.createElement('div');
    row.className = 'spline-point-row';
    const lbl = document.createElement('span');
    lbl.style.cssText = 'font-size:10px;color:#666;width:16px;';
    lbl.textContent = i;
    const ix = document.createElement('input');
    ix.type = 'number'; ix.step = 0.01; ix.value = pts[i][0].toFixed(2);
    ix.style.width = '55px'; ix.style.fontSize = '11px';
    ix.style.cssText += 'background:#3c3c3c;border:1px solid #555;color:#ccc;padding:1px 3px;border-radius:2px;';
    const iy = document.createElement('input');
    iy.type = 'number'; iy.step = 0.01; iy.value = pts[i][1].toFixed(2);
    iy.style.width = '55px'; iy.style.fontSize = '11px';
    iy.style.cssText += 'background:#3c3c3c;border:1px solid #555;color:#ccc;padding:1px 3px;border-radius:2px;';
    const ci = i; // capture
    ix.oninput = () => { pts[ci][0] = parseFloat(ix.value)||0; editor.dirty = true; };
    iy.oninput = () => { pts[ci][1] = parseFloat(iy.value)||0; editor.dirty = true; };
    const del = document.createElement('button');
    del.textContent = 'x';
    del.style.cssText = 'background:none;border:none;color:#f44;cursor:pointer;font-size:11px;padding:0 3px;';
    del.onclick = () => {
      if (pts.length > 2) { pts.splice(ci, 1); renderProps(); editor.dirty = true; }
    };
    row.appendChild(lbl); row.appendChild(ix); row.appendChild(iy); row.appendChild(del);
    container.appendChild(row);
  }

  if (pts.length < MAX_SPLINE_POINTS) {
    const addRow = document.createElement('div');
    addRow.className = 'spline-point-row';
    const addBtn = document.createElement('button');
    addBtn.textContent = '+ point';
    addBtn.style.cssText = 'background:#3c3c3c;border:1px solid #555;color:#ccc;padding:1px 8px;border-radius:2px;cursor:pointer;font-size:11px;';
    addBtn.onclick = () => { pts.push([0.5, 0.5]); renderProps(); editor.dirty = true; };
    addRow.appendChild(addBtn);
    container.appendChild(addRow);
  }
  return container;
}

function buildPaletteColors(colorBehavior) {
  const container = document.createElement('div');
  const colors = colorBehavior.colors || [];

  for (let i = 0; i < colors.length; i++) {
    const row = document.createElement('div');
    row.className = 'palette-color-row';
    const lbl = document.createElement('span');
    lbl.style.cssText = 'font-size:10px;color:#666;width:16px;';
    lbl.textContent = i;
    const inp = document.createElement('input');
    inp.type = 'color';
    inp.value = '#' + colors[i].map(v => Math.round(clamp01(v)*255).toString(16).padStart(2,'0')).join('');
    const ci = i;
    inp.oninput = () => {
      const hex = inp.value;
      colors[ci] = [parseInt(hex.slice(1,3),16)/255, parseInt(hex.slice(3,5),16)/255, parseInt(hex.slice(5,7),16)/255];
      editor.dirty = true;
    };
    const del = document.createElement('button');
    del.textContent = 'x';
    del.style.cssText = 'background:none;border:none;color:#f44;cursor:pointer;font-size:11px;padding:0 3px;';
    del.onclick = () => {
      if (colors.length > 2) { colors.splice(ci, 1); renderProps(); editor.dirty = true; }
    };
    row.appendChild(lbl); row.appendChild(inp); row.appendChild(del);
    container.appendChild(row);
  }

  if (colors.length < MAX_PALETTE_COLORS) {
    const addRow = document.createElement('div');
    addRow.className = 'palette-color-row';
    const addBtn = document.createElement('button');
    addBtn.textContent = '+ color';
    addBtn.style.cssText = 'background:#3c3c3c;border:1px solid #555;color:#ccc;padding:1px 8px;border-radius:2px;cursor:pointer;font-size:11px;';
    addBtn.onclick = () => { colors.push([1,1,1]); renderProps(); editor.dirty = true; };
    addRow.appendChild(addBtn);
    container.appendChild(addRow);
  }
  return container;
}

// =========================================================================
// TRACK LIST
// =========================================================================
function renderTrackList() {
  const list = document.getElementById('track-list');
  list.innerHTML = '';
  const tracks = editor.animation.tracks;

  for (let i = 0; i < tracks.length; i++) {
    const track = tracks[i];
    const row = document.createElement('div');
    row.className = 'track-row' + (i === editor.selectedTrack ? ' selected' : '');
    row.onclick = (e) => {
      if (e.target.classList.contains('track-delete')) return;
      editor.selectedTrack = i;
      renderTrackList();
      renderProps();
      editor.dirty = true;
    };

    const idx = document.createElement('span');
    idx.className = 'track-idx';
    idx.textContent = i;

    const info = document.createElement('span');
    info.className = 'track-info';
    info.innerHTML = `<span class="motion-type">${track.motion.type}</span>`;

    const colorPreview = document.createElement('div');
    colorPreview.className = 'track-color-preview';
    const tc = evaluateColor(track.color, 0, editor.palette);
    colorPreview.style.background = rgbfToLinearCss(tc[0], tc[1], tc[2]);

    const timing = document.createElement('span');
    timing.className = 'track-timing';
    const st = track.startTime || 0;
    const fi = track.fadeIn || 0;
    timing.textContent = st > 0 || fi > 0 ? `t=${st.toFixed(1)} f=${fi.toFixed(1)}` : '';

    const del = document.createElement('button');
    del.className = 'track-delete';
    del.textContent = '\u00d7';
    del.title = 'Delete track';
    del.onclick = () => {
      tracks.splice(i, 1);
      if (editor.selectedTrack >= tracks.length) editor.selectedTrack = tracks.length - 1;
      renderTrackList();
      renderProps();
      editor.dirty = true;
    };

    row.appendChild(idx);
    row.appendChild(info);
    row.appendChild(colorPreview);
    row.appendChild(timing);
    row.appendChild(del);
    list.appendChild(row);
  }
}

// =========================================================================
// JSON IMPORT / EXPORT
// =========================================================================
function exportAnimation() {
  const anim = editor.animation;
  const out = {
    name: anim.name,
    duration: anim.duration,
    tracks: anim.tracks.map(t => {
      const track = {motion: {...t.motion}, color: {...t.color}};
      // Radius
      const r = normalizeScalar(t.radius);
      track.radius = r.type === 'static' ? r.value : {...r};
      // Intensity
      const inten = normalizeScalar(t.intensity);
      track.intensity = inten.type === 'static' ? inten.value : {...inten};
      // Timing
      if (t.startTime) track.startTime = t.startTime;
      if (t.fadeIn) track.fadeIn = t.fadeIn;
      // Deep copy arrays
      if (track.motion.points) track.motion.points = track.motion.points.map(p => [...p]);
      if (track.color.colors) track.color.colors = track.color.colors.map(c => [...c]);
      if (track.color.color) track.color.color = [...track.color.color];
      if (track.motion.pos) track.motion.pos = [...track.motion.pos];
      if (track.motion.center) track.motion.center = [...track.motion.center];
      if (track.motion.a) track.motion.a = [...track.motion.a];
      if (track.motion.b) track.motion.b = [...track.motion.b];
      if (!track.motion.reverse) delete track.motion.reverse;
      if (!track.color.ping_pong) delete track.color.ping_pong;
      return track;
    }),
  };
  return out;
}

function importAnimation(json) {
  try {
    const obj = typeof json === 'string' ? JSON.parse(json) : json;
    if (!obj.tracks || !Array.isArray(obj.tracks) || obj.tracks.length === 0) {
      alert('Invalid animation: missing or empty tracks array');
      return;
    }
    // Normalize tracks
    for (const t of obj.tracks) {
      if (!t.motion) t.motion = {type: 'static', pos: [0.5, 0.5]};
      if (!t.color) t.color = {type: 'palette_slot', slot: 'user_primary'};
      t.radius = normalizeScalar(t.radius);
      t.intensity = normalizeScalar(t.intensity);
      if (!t.startTime) t.startTime = 0;
      if (!t.fadeIn) t.fadeIn = 0;
    }
    editor.animation = {
      name: obj.name || 'imported',
      duration: obj.duration || 0,
      tracks: obj.tracks.slice(0, MAX_LIGHTS),
    };
    editor.selectedTrack = 0;
    editor.time = 0;
    document.getElementById('anim-name').value = editor.animation.name;
    document.getElementById('anim-duration').value = editor.animation.duration;
    renderTrackList();
    renderProps();
    editor.dirty = true;
  } catch (e) {
    alert('JSON parse error: ' + e.message);
  }
}

function showExportModal() {
  const anim = exportAnimation();
  const compactChk = document.getElementById('json-compact');
  const textarea = document.getElementById('json-textarea');

  function formatJson() {
    return compactChk.checked ? JSON.stringify(anim) : JSON.stringify(anim, null, 2);
  }

  document.getElementById('json-modal-title').textContent = 'Export JSON';
  document.getElementById('json-compact-label').style.display = '';
  textarea.value = formatJson();
  compactChk.onchange = () => { textarea.value = formatJson(); };
  document.getElementById('json-modal-ok').textContent = 'Copy';
  document.getElementById('json-modal-ok').onclick = () => {
    navigator.clipboard.writeText(textarea.value).then(() => {
      document.getElementById('json-modal-ok').textContent = 'Copied!';
      setTimeout(() => closeModal(), 500);
    });
  };
  document.getElementById('json-modal').classList.add('open');
}

function showImportModal() {
  document.getElementById('json-compact-label').style.display = 'none';
  document.getElementById('json-modal-title').textContent = 'Import JSON';
  document.getElementById('json-textarea').value = '';
  document.getElementById('json-modal-ok').textContent = 'Load';
  document.getElementById('json-modal-ok').onclick = () => {
    importAnimation(document.getElementById('json-textarea').value);
    closeModal();
  };
  document.getElementById('json-modal').classList.add('open');
}

function closeModal() {
  document.getElementById('json-modal').classList.remove('open');
}

function sendToBadge() {
  const json = JSON.stringify(exportAnimation());
  const cmd = 'animate load ' + json;
  fetch('/api/send', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({command: cmd}),
  }).then(r => {
    if (r.ok) {
      document.getElementById('btn-send').textContent = 'Sent!';
      setTimeout(() => { document.getElementById('btn-send').textContent = 'Send'; }, 1500);
    } else {
      alert('Send failed: ' + r.statusText);
    }
  }).catch(() => {
    alert('Could not connect to preview server.\nRun: python3 tools/led_preview.py');
  });
}

// =========================================================================
// DRAG HANDLING
// =========================================================================
let drag = null;

function pageToSvg(pageX, pageY) {
  const pt = svgEl.createSVGPoint();
  pt.x = pageX;
  pt.y = pageY;
  return pt.matrixTransform(svgEl.getScreenCTM().inverse());
}

svgEl.addEventListener('mousedown', (e) => {
  if (e.target.dataset.trackIdx === undefined) return;

  const idx = parseInt(e.target.dataset.trackIdx);
  editor.selectedTrack = idx;
  renderTrackList();
  renderProps();

  const track = editor.animation.tracks[idx];
  if (!track) return;

  const handleId = e.target.dataset.handle;
  drag = {trackIdx: idx};

  if (handleId) {
    // Path overlay handle (pingpong endpoints, spline control points)
    drag.handle = handleId;
  } else {
    // Light center marker — drag pos or center
    const m = track.motion;
    if (m.type === 'static') drag.handle = 'pos';
    else if (m.center) drag.handle = 'center';
    else { drag = null; return; }
  }

  e.preventDefault();
});

svgEl.addEventListener('dblclick', (e) => {
  if (editor.animation.tracks.length >= MAX_LIGHTS) return;
  const svgPt = pageToSvg(e.pageX, e.pageY);
  const [nx, ny] = svgToNorm(svgPt.x, svgPt.y);
  const track = newTrack([clamp01(nx), clamp01(ny)]);
  editor.animation.tracks.push(track);
  editor.selectedTrack = editor.animation.tracks.length - 1;
  renderTrackList();
  renderProps();
  editor.dirty = true;
});

document.addEventListener('mousemove', (e) => {
  if (!drag) return;
  const svgPt = pageToSvg(e.pageX, e.pageY);
  const [nx, ny] = svgToNorm(svgPt.x, svgPt.y);

  const track = editor.animation.tracks[drag.trackIdx];
  if (!track) { drag = null; return; }

  const m = track.motion;
  const h = drag.handle;

  if (h === 'pos') m.pos = [nx, ny];
  else if (h === 'center') m.center = [nx, ny];
  else if (h === 'a') m.a = [nx, ny];
  else if (h === 'b') m.b = [nx, ny];
  else if (h.startsWith('spline-')) {
    const pi = parseInt(h.split('-')[1]);
    if (m.points && pi < m.points.length) m.points[pi] = [nx, ny];
  }

  editor.dirty = true;
  renderProps();
});

document.addEventListener('mouseup', () => { drag = null; });

// =========================================================================
// EVENT LISTENERS
// =========================================================================
// Transport
document.getElementById('btn-play').onclick = () => { editor.playing = true; };
document.getElementById('btn-pause').onclick = () => { editor.playing = false; };
document.getElementById('btn-stop').onclick = () => { editor.playing = false; editor.time = 0; editor.dirty = true; };
document.getElementById('chk-loop').onchange = (e) => { editor.looping = e.target.checked; };

document.getElementById('time-scrub').oninput = (e) => {
  e.target._dragging = true;
  editor.time = parseFloat(e.target.value);
  editor.dirty = true;
};
document.getElementById('time-scrub').onchange = (e) => { e.target._dragging = false; };

document.getElementById('speed-slider').oninput = (e) => {
  editor.speed = parseFloat(e.target.value);
  document.getElementById('speed-val').textContent = editor.speed + 'x';
};

document.getElementById('hue-slider').oninput = (e) => {
  editor.userHue = parseInt(e.target.value);
  editor.palette = resolvePalette(editor.userHue);
  updatePaletteBar();
  const [r, g, b] = hsvToRgb(editor.userHue / 360, 0.9, 1.0);
  document.getElementById('hue-swatch').style.background = rgbfToLinearCss(r, g, b);
  editor.dirty = true;
};

// Timeline header
document.getElementById('anim-name').oninput = (e) => { editor.animation.name = e.target.value; };
document.getElementById('anim-duration').oninput = (e) => { editor.animation.duration = parseFloat(e.target.value) || 0; };

document.getElementById('preset-select').onchange = (e) => {
  const name = e.target.value;
  if (name && PRESETS[name]) {
    importAnimation(JSON.parse(JSON.stringify(PRESETS[name])));
    e.target.value = '';
  }
};

document.getElementById('btn-add-track').onclick = () => {
  if (editor.animation.tracks.length >= MAX_LIGHTS) return;
  editor.animation.tracks.push(newTrack());
  editor.selectedTrack = editor.animation.tracks.length - 1;
  renderTrackList();
  renderProps();
  editor.dirty = true;
};

document.getElementById('btn-import').onclick = showImportModal;
document.getElementById('btn-export').onclick = showExportModal;
document.getElementById('btn-send').onclick = sendToBadge;
document.getElementById('json-modal-cancel').onclick = closeModal;
document.getElementById('json-modal').onclick = (e) => {
  if (e.target === document.getElementById('json-modal')) closeModal();
};

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
  switch (e.key) {
    case ' ':
      e.preventDefault();
      editor.playing = !editor.playing;
      break;
    case 'Escape':
      if (document.getElementById('json-modal').classList.contains('open')) {
        closeModal();
      } else {
        editor.playing = false;
        editor.time = 0;
        editor.dirty = true;
      }
      break;
    case 'Delete':
    case 'Backspace': {
      const idx = editor.selectedTrack;
      const tracks = editor.animation.tracks;
      if (idx >= 0 && idx < tracks.length && tracks.length > 0) {
        tracks.splice(idx, 1);
        if (editor.selectedTrack >= tracks.length) editor.selectedTrack = tracks.length - 1;
        renderTrackList();
        renderProps();
        editor.dirty = true;
      }
      break;
    }
  }
  // Number keys 1-8 to select tracks
  if (e.key >= '1' && e.key <= '8') {
    const idx = parseInt(e.key) - 1;
    if (idx < editor.animation.tracks.length) {
      editor.selectedTrack = idx;
      renderTrackList();
      renderProps();
      editor.dirty = true;
    }
  }
});

// =========================================================================
// MAIN LOOP
// =========================================================================
let lastTimestamp = 0;

function mainLoop(timestamp) {
  const dt = lastTimestamp ? (timestamp - lastTimestamp) / 1000 : 0;
  lastTimestamp = timestamp;

  if (editor.playing) {
    editor.time += dt * editor.speed;
    const dur = editor.animation.duration;
    if (dur > 0 && editor.time >= dur) {
      if (editor.looping) {
        editor.time %= dur;
      } else {
        editor.time = dur;
        editor.playing = false;
      }
    }
    editor.dirty = true;
  }

  if (editor.dirty) {
    evaluateFrame(editor.time);
    renderCanvas();
    editor.dirty = false;
  }

  updateTransport();

  // FPS
  editor.frameCount++;
  if (timestamp - editor.lastFpsTime >= 1000) {
    document.getElementById('fps-display').textContent = editor.frameCount + ' fps';
    editor.frameCount = 0;
    editor.lastFpsTime = timestamp;
  }

  requestAnimationFrame(mainLoop);
}

// =========================================================================
// INITIALIZATION
// =========================================================================
function init() {
  // Set initial hue swatch
  const [r, g, b] = hsvToRgb(editor.userHue / 360, 0.9, 1.0);
  document.getElementById('hue-swatch').style.background = rgbfToLinearCss(r, g, b);

  renderPaletteBar();
  renderTrackList();
  renderProps();
  editor.dirty = true;

  requestAnimationFrame(mainLoop);
}

init();
</script>
