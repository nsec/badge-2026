    <circle id="dot14" cx="112.83" cy="151.20" r="1.8" fill="#000" stroke="#333" stroke-width="0.2"/>
    <circle id="dot15" cx="99.43"  cy="151.30" r="1.8" fill="#000" stroke="#333" stroke-width="0.2"/>
    <circle id="dot16" cx="88.53"  cy="151.10" r="1.8" fill="#000" stroke="#333" stroke-width="0.2"/>
    <circle id="dot17" cx="75.53"  cy="151.10" r="1.8" fill="#000" stroke="#333" stroke-width="0.2"/>
  </g>

  <!-- LED index labels -->
  <g font-family="monospace" font-size="3" fill="#555" text-anchor="middle" dominant-baseline="central">
    <text x="63.80"  y="99.37">0</text>
    <text x="62.78"  y="90.66">1</text>
    <text x="68.78"  y="70.69">2</text>
    <text x="78.86"  y="58.46">3</text>
    <text x="90.43"  y="48.99">4</text>
    <text x="97.08"  y="51.79">5</text>
    <text x="109.13" y="52.60">6</text>
    <text x="121.19" y="52.03">7</text>
    <text x="129.64" y="50.66">8</text>
    <text x="139.71" y="58.23">9</text>
    <text x="156.13" y="91.78">10</text>
    <text x="155.21" y="99.75">11</text>
    <text x="143.06" y="151.41">12</text>
    <text x="127.80" y="151.30">13</text>
    <text x="112.83" y="151.20">14</text>
    <text x="99.43"  y="151.30">15</text>
    <text x="88.53"  y="151.10">16</text>
    <text x="75.53"  y="151.10">17</text>
  </g>

  <!-- Light source markers (populated dynamically) -->
  <g id="lights"></g>
</svg>

<div id="fps">-- fps</div>

<script>
const NUM_LEDS = 18;
const MAX_LIGHTS = 16;
const SVG_NS = 'http://www.w3.org/2000/svg';

// Normalized [0,1] → SVG coordinate mapping (from led_positions.h).
const X_MIN = 62.78, X_RANGE = 93.35;
const Y_MIN = 48.99, Y_RANGE = 102.42;
function normToSvgX(nx) { return X_MIN + nx * X_RANGE; }
function normToSvgY(ny) { return Y_MIN + ny * Y_RANGE; }

// Cache SVG gradient references.
const gradients = [];
for (let i = 0; i < NUM_LEDS; i++) {
  gradients.push(document.getElementById('g' + i));
}

const dots = [];
for (let i = 0; i < NUM_LEDS; i++) {
  dots.push(document.getElementById('dot' + i));
}

const statusEl = document.getElementById('status');
const fpsEl = document.getElementById('fps');
const lightsGroup = document.getElementById('lights');

// Pre-create light source marker elements.
const lightMarkers = [];
const lightRadii = [];
for (let i = 0; i < MAX_LIGHTS; i++) {
  // Radius ring (shows falloff area).
  const ring = document.createElementNS(SVG_NS, 'circle');
  ring.setAttribute('fill', 'none');
  ring.setAttribute('stroke-width', '0.3');
  ring.setAttribute('stroke-dasharray', '1,1');
  ring.setAttribute('opacity', '0');
  lightsGroup.appendChild(ring);
  lightRadii.push(ring);

  // Center dot with crosshair.
  const dot = document.createElementNS(SVG_NS, 'circle');
  dot.setAttribute('r', '1.5');
  dot.setAttribute('fill', 'none');
  dot.setAttribute('stroke-width', '0.4');
  dot.setAttribute('opacity', '0');
  lightsGroup.appendChild(dot);
  lightMarkers.push(dot);
}

// FPS tracking.
let frameCount = 0;
let lastFpsTime = performance.now();

function updateFps() {
  const now = performance.now();
  const elapsed = now - lastFpsTime;
  if (elapsed >= 1000) {
    fpsEl.textContent = Math.round(frameCount * 1000 / elapsed) + ' fps';
    frameCount = 0;
    lastFpsTime = now;
  }
}

// Read a little-endian float from a binary string at offset.
function readFloat(bin, off) {
  const buf = new ArrayBuffer(4);
  const view = new DataView(buf);
  for (let i = 0; i < 4; i++) view.setUint8(i, bin.charCodeAt(off + i));
  return view.getFloat32(0, true);  // little-endian
}

// Decode base64 frame and update LED colors + light sources.
function applyFrame(b64) {
  const binary = atob(b64);
  if (binary.length < NUM_LEDS * 3) return;

  // --- LED pixels ---
  for (let i = 0; i < NUM_LEDS; i++) {
    const r = binary.charCodeAt(i * 3);
    const g = binary.charCodeAt(i * 3 + 1);
    const b = binary.charCodeAt(i * 3 + 2);
    const color = `rgb(${r},${g},${b})`;

    const grad = gradients[i];
    const stops = grad.getElementsByTagName('stop');
    if (stops.length >= 2) {
      stops[0].setAttribute('stop-color', color);
      stops[0].setAttribute('stop-opacity', '0.9');
      stops[1].setAttribute('stop-color', color);
      stops[1].setAttribute('stop-opacity', '0');
    }

    dots[i].setAttribute('fill', color);
  }

  // --- Light sources ---
  let off = NUM_LEDS * 3;
  const lightCount = (off < binary.length) ? binary.charCodeAt(off) : 0;
  off++;

  for (let i = 0; i < MAX_LIGHTS; i++) {
    if (i < lightCount && off + 28 <= binary.length) {
      const x   = readFloat(binary, off);
      const y   = readFloat(binary, off + 4);
      const lr  = readFloat(binary, off + 8);
      const lg  = readFloat(binary, off + 12);
      const lb  = readFloat(binary, off + 16);
      const rad = readFloat(binary, off + 20);
      const intensity = readFloat(binary, off + 24);
      off += 28;

      const sx = normToSvgX(x);
      const sy = normToSvgY(y);
      // Color scaled by intensity for visibility.
      const cr = Math.round(Math.min(1, lr * intensity) * 255);
      const cg = Math.round(Math.min(1, lg * intensity) * 255);
      const cb = Math.round(Math.min(1, lb * intensity) * 255);
      const color = `rgb(${cr},${cg},${cb})`;
      const alpha = Math.min(1, intensity).toFixed(2);

      // Radius ring — map normalized radius to SVG units.
      const svgRad = rad * Math.max(X_RANGE, Y_RANGE);
      lightRadii[i].setAttribute('cx', sx);
      lightRadii[i].setAttribute('cy', sy);
      lightRadii[i].setAttribute('r', svgRad);
      lightRadii[i].setAttribute('stroke', color);
      lightRadii[i].setAttribute('opacity', alpha * 0.5);

      // Center marker.
      lightMarkers[i].setAttribute('cx', sx);
      lightMarkers[i].setAttribute('cy', sy);
      lightMarkers[i].setAttribute('stroke', color);
      lightMarkers[i].setAttribute('opacity', alpha);
    } else {
      lightRadii[i].setAttribute('opacity', '0');
      lightMarkers[i].setAttribute('opacity', '0');
    }
  }

  frameCount++;
  updateFps();
}

// Connect via Server-Sent Events.
function connect() {
  const source = new EventSource('/events');

  source.onopen = () => {
    statusEl.textContent = 'Connected';
    statusEl.className = 'connected';
  };

  source.onmessage = (event) => {
    applyFrame(event.data.trim());
  };

  source.onerror = () => {
    statusEl.textContent = 'Disconnected — retrying...';
    statusEl.className = 'disconnected';
    source.close();
    setTimeout(connect, 1000);
  };
}

connect();
</script>
</body>
</html>
