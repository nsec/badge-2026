name: build

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run clang-format
        run: ./format-cpp

      - name: Check for formatting changes
        run: git diff --exit-code

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      # --- Build all firmware + SPIFFS in one pass ---
      # Install mkspiffs first so the post-build script can produce
      # spiffs.bin alongside firmware.bin in a single `pio run`.
      # Avoids separate `buildfs` steps that wipe firmware outputs.
      - name: Install mkspiffs tool
        run: |
          pio pkg install -g --tool "platformio/tool-mkspiffs@~2"

      # --- Apply release build hardening (CI only — does not modify repo) ---
      - name: Harden build for release
        run: |
          SDKCONFIG="sdkconfig.badge_esp32s3"

          # Switch compiler optimization from -Og (debug) to -Os (size)
          sed -i 's/^CONFIG_COMPILER_OPTIMIZATION_DEFAULT=y$/# CONFIG_COMPILER_OPTIMIZATION_DEFAULT is not set/' "$SDKCONFIG"
          sed -i 's/^# CONFIG_COMPILER_OPTIMIZATION_SIZE is not set$/CONFIG_COMPILER_OPTIMIZATION_SIZE=y/' "$SDKCONFIG"

          # Silent assertions — removes __FILE__ / line-number strings from binary
          sed -i 's/^CONFIG_COMPILER_OPTIMIZATION_ASSERTIONS_ENABLE=y$/# CONFIG_COMPILER_OPTIMIZATION_ASSERTIONS_ENABLE is not set/' "$SDKCONFIG"
          sed -i 's/^# CONFIG_COMPILER_OPTIMIZATION_ASSERTIONS_SILENT is not set$/CONFIG_COMPILER_OPTIMIZATION_ASSERTIONS_SILENT=y/' "$SDKCONFIG"
          sed -i 's/^CONFIG_COMPILER_OPTIMIZATION_ASSERTION_LEVEL=2$/CONFIG_COMPILER_OPTIMIZATION_ASSERTION_LEVEL=1/' "$SDKCONFIG"

          # Reduce ESP-IDF log level to ERROR — strips info/warn/debug format strings
          sed -i 's/^CONFIG_LOG_DEFAULT_LEVEL_INFO=y$/# CONFIG_LOG_DEFAULT_LEVEL_INFO is not set/' "$SDKCONFIG"
          sed -i 's/^# CONFIG_LOG_DEFAULT_LEVEL_ERROR is not set$/CONFIG_LOG_DEFAULT_LEVEL_ERROR=y/' "$SDKCONFIG"
          sed -i 's/^CONFIG_LOG_DEFAULT_LEVEL=3$/CONFIG_LOG_DEFAULT_LEVEL=1/' "$SDKCONFIG"
          sed -i 's/^CONFIG_LOG_MAXIMUM_LEVEL=3$/CONFIG_LOG_MAXIMUM_LEVEL=1/' "$SDKCONFIG"

          # Add -DNDEBUG to all ESP32 build environments (strips C assert() strings)
          # Only matches -std=gnu++17 which appears in ESP32 envs, not native (-std=c++17)
          sed -i 's/-std=gnu++17/-std=gnu++17\n  -DNDEBUG/' platformio.ini

          echo "Release hardening applied:"
          grep -E 'OPTIMIZATION_(SIZE|ASSERTIONS_SILENT|DEFAULT)' "$SDKCONFIG" | head -5
          grep 'LOG_DEFAULT_LEVEL=' "$SDKCONFIG" | head -2

      - name: Build all firmware variants
        run: pio run

      # --- Strip ELF symbol tables (prevents function name recovery in RE tools) ---
      - name: Strip debug symbols from firmware ELF
        run: |
          STRIP=$(find ~/.platformio/packages -name 'xtensa-esp32s3-elf-strip' -type f 2>/dev/null | head -1)
          if [ -z "$STRIP" ]; then
            echo "::warning::xtensa strip tool not found, skipping ELF stripping"
            exit 0
          fi
          for env in esp32-s3-devkitc-1-conference esp32-s3-devkitc-1-conference-only esp32-s3-devkitc-1-ctf; do
            elf=".pio/build/${env}/firmware.elf"
            if [ -f "$elf" ]; then
              size_before=$(stat -c%s "$elf")
              "$STRIP" --strip-all "$elf"
              size_after=$(stat -c%s "$elf")
              echo "Stripped ${env}: ${size_before} -> ${size_after} bytes"
            fi
          done

      # --- Verify build outputs exist before packaging ---
      - name: Verify build outputs
        run: |
          fail=0
          for env in esp32-s3-devkitc-1-conference esp32-s3-devkitc-1-conference-only esp32-s3-devkitc-1-ctf; do
            dir=".pio/build/${env}"
            echo "=== ${env} ==="
            ls -la "${dir}"/*.bin 2>/dev/null || { echo "ERROR: no .bin files in ${dir}"; fail=1; }
          done
          exit $fail

      # --- Determine version string ---
      - name: Set version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          fi

      # --- Package both release modes ---
      - name: Package release artifacts
        run: |
          python tools/package_release.py \
            --version "${{ steps.version.outputs.version }}" \
            --output-dir release

      # --- Validate conference-only package ---
      - name: Validate conference-only package (no CTF leaks)
        run: |
          python tools/validate_conference_only.py release/conference-only/

      # --- Upload artifacts ---
      - name: Upload conference-only package
        uses: actions/upload-artifact@v4
        with:
          name: nsec2026-conference-only
          path: release/conference-only/

      - name: Upload dual-firmware package
        uses: actions/upload-artifact@v4
        with:
          name: nsec2026-dual-firmware
          path: release/dual/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - name: Download conference-only artifacts
        uses: actions/download-artifact@v4
        with:
          name: nsec2026-conference-only
          path: release/conference-only

      - name: Download dual-firmware artifacts
        uses: actions/download-artifact@v4
        with:
          name: nsec2026-dual-firmware
          path: release/dual

      - name: Determine version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Create release archives
        run: |
          cd release
          tar czf "nsec2026-conference-only-${{ steps.version.outputs.version }}.tar.gz" -C conference-only .
          tar czf "nsec2026-dual-firmware-${{ steps.version.outputs.version }}.tar.gz" -C dual .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/nsec2026-conference-only-${{ steps.version.outputs.version }}.tar.gz
            release/nsec2026-dual-firmware-${{ steps.version.outputs.version }}.tar.gz
            release/conference-only/badge-conference.bin
            release/conference-only/manifest.json
            release/dual/badge-conference.bin
            release/dual/badge-ctf.bin
            release/dual/bootloader.bin
            release/dual/partitions.bin
            release/dual/manifest.json
          body: |
            ## NorthSec Badge 2026 Firmware — ${{ steps.version.outputs.version }}

            Two release packages are available:

            ### 📦 Conference-Only (`nsec2026-conference-only-${{ steps.version.outputs.version }}.tar.gz`)
            For pre-CTF badge distribution. Contains only conference firmware.
            - No CTF firmware, no `swapboot` command, no challenge code.
            - Safe for public distribution before the CTF begins.

            ### 📦 Dual Firmware (`nsec2026-dual-firmware-${{ steps.version.outputs.version }}.tar.gz`)
            Full badge experience with both conference and CTF firmware.
            - Badge boots to conference by default.
            - Use `swapboot` CLI command to switch to CTF challenges.

            ### Quick Flash
            Extract the desired package and run:
            ```bash
            python flash.py --mode conference-only --port <PORT>   # conference-only
            python flash.py --mode dual --port <PORT>              # dual firmware
            ```

            ### Memory Map
            | Address | Content |
            |---------|---------|
            | 0x0     | Bootloader |
            | 0x8000  | Partition table |
            | 0x10000 | Conference firmware |
            | 0x150000| CTF firmware (dual only) |

            See `README.txt` in each package for detailed instructions.
