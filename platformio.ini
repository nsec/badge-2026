[platformio]
default_envs = esp32-s3-devkitc-1-conference, esp32-s3-devkitc-1-ctf

[env:esp32-s3-devkitc-1-conference]
platform = https://github.com/platformio/platform-espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 8MB
; Custom partition table (conference + ctf)
board_build.partitions = partitions/badge_factory_ota.csv

; Patch RFAL library for ESP32 compatibility (BR macro conflict)
extra_scripts = pre:extra_scripts/patch_rfal.py

; Build flags
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -I include
  -D NSEC_BADGE_YEAR=2026
  -D CORE_DEBUG_LEVEL=0
  -D ARDUINO_USB_CDC_ON_BOOT=1  ; Use USB CDC for Serial
  -D ARDUINO_USB_MODE=1
  -D HAS_CONFERENCE=1  ; Enable conference modules

; Explicitly include local libraries
; Conference firmware: core + conference modules
lib_deps =
  core
  conference
  adafruit/Adafruit NeoPixel@^1.12.0
  https://github.com/p0ns/NFC-RFAL.git
  https://github.com/stm32duino/ST25R3916.git
lib_ignore =
  simulator

; Serial monitor configuration
monitor_speed = 115200
monitor_filters = 
  default
  time
monitor_rts = 0
monitor_dtr = 0


; Optional filesystem (SPIFFS) image support
board_build.filesystem = spiffs

; Environment for uploading to ctf partition (CTF challenges firmware)
[env:esp32-s3-devkitc-1-ctf]
extends = env:esp32-s3-devkitc-1-conference
board_upload.offset_address = 0x150000
; CTF firmware: core + challenges modules (not conference)
; Override build_flags to exclude HAS_CONFERENCE
build_flags =
  -std=gnu++17
  -I include
  -D NSEC_BADGE_YEAR=2026
  -D CORE_DEBUG_LEVEL=0
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D HAS_CHALLENGES=1  ; Enable challenges (NOT conference)
lib_deps =
  core
  challenges
  adafruit/Adafruit NeoPixel@^1.12.0
  https://github.com/p0ns/NFC-RFAL.git
  https://github.com/stm32duino/ST25R3916.git

; =============================================================================
; Native/Desktop Simulator Environment
; =============================================================================
[env:native]
platform = native
build_type = debug
build_flags =
    -D NATIVE_BUILD
    -D HAS_CONFERENCE=1
    -D NSEC_BADGE_YEAR=2026
    -std=c++17
    -pthread
    -O0
    -g3
    -I include
    -I lib/simulator/arduino
    -I lib/simulator/esp_idf
    -I lib/simulator/freertos
    -I extern/FreeRTOS-Kernel/include
    -I extern/FreeRTOS-Kernel/portable/ThirdParty/GCC/Posix
    -I extern/FreeRTOS-Kernel/portable/ThirdParty/GCC/Posix/utils
lib_deps =
    simulator
    core
    conference
lib_ldf_mode = deep+
build_src_filter =
    +<*>
    +<../lib/simulator/sim_main.cpp>
    +<../extern/FreeRTOS-Kernel/tasks.c>
    +<../extern/FreeRTOS-Kernel/queue.c>
    +<../extern/FreeRTOS-Kernel/list.c>
    +<../extern/FreeRTOS-Kernel/timers.c>
    +<../extern/FreeRTOS-Kernel/portable/ThirdParty/GCC/Posix/port.c>
    +<../extern/FreeRTOS-Kernel/portable/ThirdParty/GCC/Posix/utils/wait_for_event.c>
    +<../extern/FreeRTOS-Kernel/portable/MemMang/heap_3.c>
