[platformio]
default_envs = esp32-s3-devkitc-1-conference, esp32-s3-devkitc-1-conference-only, esp32-s3-devkitc-1-ctf

; =============================================================================
; Common ESP32-S3 settings shared by all badge environments
; =============================================================================
[badge_base]
platform = https://github.com/platformio/platform-espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 8MB
board_build.partitions = partitions/badge_factory_ota.csv
extra_scripts =
  pre:scripts/embed_html.py
  pre:extra_scripts/patch_rfal.py
  pre:extra_scripts/build_spiffs.py
build_unflags = -std=gnu++11
lib_ignore = simulator
monitor_speed = 115200
monitor_filters =
  default
  time
monitor_rts = 0
monitor_dtr = 0
board_build.filesystem = spiffs

; =============================================================================
; Conference firmware (used in DUAL-firmware builds — swapboot enabled)
; =============================================================================
[env:esp32-s3-devkitc-1-conference]
extends = badge_base
build_flags =
  -std=gnu++17
  -I include
  -D NSEC_BADGE_YEAR=2026
  -D CORE_DEBUG_LEVEL=0
  -D ARDUINO_USB_CDC_ON_BOOT=1  ; Use USB CDC for Serial
  -D ARDUINO_USB_MODE=1
  -D HAS_CONFERENCE=1  ; Enable conference modules

; Conference firmware: core + conference modules
lib_deps =
  core
  conference
  adafruit/Adafruit NeoPixel@^1.12.0
  https://github.com/p0ns/NFC-RFAL.git
  https://github.com/stm32duino/ST25R3916.git
  zinggjm/GxEPD2@^1.6.5
  johboh/nlohmann-json@3.12.0
  esp32async/ESPAsyncWebServer@3.10.0
  esp32async/AsyncTCP@3.4.10

lib_ldf_mode = deep+

; =============================================================================
; Conference-only firmware (NO CTF — swapboot disabled)
; For pre-CTF distribution. Does not ship CTF binary or expose swap command.
; =============================================================================
[env:esp32-s3-devkitc-1-conference-only]
extends = badge_base
build_flags =
  -std=gnu++17
  -I include
  -D NSEC_BADGE_YEAR=2026
  -D CORE_DEBUG_LEVEL=0
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D HAS_CONFERENCE=1
  -D CONFERENCE_ONLY=1  ; Disables swapboot CLI, signals standalone mode

lib_deps =
  core
  conference
  adafruit/Adafruit NeoPixel@^1.12.0
  https://github.com/p0ns/NFC-RFAL.git
  https://github.com/stm32duino/ST25R3916.git
  zinggjm/GxEPD2@^1.6.5
  johboh/nlohmann-json@3.12.0
  esp32async/ESPAsyncWebServer@3.10.0
  esp32async/AsyncTCP@3.4.10

; =============================================================================
; CTF firmware (used in dual-firmware builds only)
; =============================================================================
[env:esp32-s3-devkitc-1-ctf]
extends = badge_base
board_upload.offset_address = 0x150000
board_build.data_dir = data-ctf
; CTF firmware: core + challenges modules (not conference)
build_flags =
  -std=gnu++17
  -I include
  -D NSEC_BADGE_YEAR=2026
  -D CORE_DEBUG_LEVEL=0
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D HAS_CHALLENGES=1  ; Enable challenges (NOT conference)
lib_deps =
  core
  challenges
  adafruit/Adafruit NeoPixel@^1.12.0
  https://github.com/p0ns/NFC-RFAL.git
  https://github.com/stm32duino/ST25R3916.git
  zinggjm/GxEPD2@^1.6.5
  johboh/nlohmann-json@3.12.0
  esp32async/ESPAsyncWebServer@3.10.0
  esp32async/AsyncTCP@3.4.10

; =============================================================================
; Native/Desktop Simulator Environment
; =============================================================================
[env:native]
platform = native
build_type = debug
build_flags =
    -D NATIVE_BUILD
    -D HAS_CONFERENCE=1
    -D NSEC_BADGE_YEAR=2026
    -std=c++17
    -pthread
    -O0
    -g3
    -I include
    -I lib/simulator/arduino
    -I lib/simulator/esp_idf
    -I lib/simulator/freertos
    -I extern/FreeRTOS-Kernel/include
    -I extern/FreeRTOS-Kernel/portable/ThirdParty/GCC/Posix
    -I extern/FreeRTOS-Kernel/portable/ThirdParty/GCC/Posix/utils
lib_deps =
    simulator
    core
    conference
    johboh/nlohmann-json@3.12.0
lib_ldf_mode = deep+
build_src_filter =
    +<*>
    +<../lib/simulator/sim_main.cpp>
    +<../extern/FreeRTOS-Kernel/tasks.c>
    +<../extern/FreeRTOS-Kernel/queue.c>
    +<../extern/FreeRTOS-Kernel/list.c>
    +<../extern/FreeRTOS-Kernel/timers.c>
    +<../extern/FreeRTOS-Kernel/portable/ThirdParty/GCC/Posix/port.c>
    +<../extern/FreeRTOS-Kernel/portable/ThirdParty/GCC/Posix/utils/wait_for_event.c>
    +<../extern/FreeRTOS-Kernel/portable/MemMang/heap_3.c>
